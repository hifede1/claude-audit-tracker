  URL del artifact: https://claude.ai/code/artifact/fd9b5145-b109-4a6d-9cd7-f586fcf4d00b
  PROTOCOLO DE ACTUALIZACIÓN (para cualquier sesión futura):
  1. Los datos viven en las constantes JS del <script> (LAST_AUDIT, DATA, DEBT, EST, PLAN,
     CHANGELOG, CLOSED_COUNT, DECISIONS, DECISION_PENDS, TESTS, REFS). La lógica de render
     NO se toca en actualizaciones normales.
  2. Ticks en localStorage con IDs ESTABLES (jamás renombrar ids). Ámbar = marcado sin
     verificar; verde = solo vía re-auditoría (borrar de DATA y sumar a CLOSED_COUNT).
  3. Re-auditoría: verificar EN CÓDIGO los ámbar, borrar confirmados de DATA/DEBT/EST/PLAN,
     CLOSED_COUNT += n, entrada fechada en CHANGELOG, actualizar TESTS/REFS/mapa/stack,
     node --check al JS, redeploy A LA MISMA URL (parámetro url del tool Artifact), commit
     en rama + PR (en modo orquestado el PR del tracker es bookkeeping: automerge).
  4. Calibración vigente: unidad=sesiones (~2-4h) · actores=fede(hifede1)+Claude, misma
     cuenta GitHub (firma = comentario "✅ validado" en el PR) · metodología=directa ·

const CHANGELOG = [
 {f:"2026-07-28 (2)", t:"S07·A CERRADA (PR #54 mergeado por Fede = firma; issue #41 cerrado via Closes). PRIMERA CORRIDA REAL DE /proximo-encargo EN 6 MESES: el comando existía con spec estable desde v1.1 y ninguna máquina había tomado jamás un encargo. Corrieron los 9 pasos del protocolo — ejecutor por --assignee @me, encargo por sesion-NN más baja, prerrequisitos verificados, reclamo 🔒 tras comprobar que el previo estaba LIBERADO con 🔓, barrido de referencias, rama nueva desde main actualizado, criterios + gates, PR con Closes #NN sin cerrar el issue a mano. Camino recorrido por el encargo #41: reclamado el 27/7 por el orquestador → PR #44 VETADO a propósito (S08) → liberado 🔓 → RE-PRIORIZADO por el validador el 28/7 → tomado por /proximo-encargo → cerrado. EL HALLAZGO: el barrido por TRIGGER trajo docs/references/verificacion-de-criterios.md, que la ficha NO linkea — se destiló AYER por la regla de post-mortem de S06 (v1.13.0) y llegó sola. Y no fue decorativo: lo primero que documenta es el falso positivo por afirmación citada dentro de su propia corrección, que es EXACTAMENTE el error que ese mismo criterio dio en la corrida vetada. Se aplicó (chequeo acotado al frontmatter) y dio verde legítimo. Es decisiones/009 funcionando de forma observable por primera vez: el conocimiento busca al encargo. Cadena completa: error del 27/7 → destilado por la regla nueva → cargado por trigger el 28/7 → aplicado en el encargo que lo había sufrido. Además: el cherry-pick del trabajo vetado chocó en el catálogo (el PR #46 lo había cambiado); se tomó la versión de main para todo lo ajeno al encargo y se reaplicó a mano lo propio — arrastrar el catálogo viejo habría revertido en silencio el refresco del #46. Y el drift se RE-VERIFICÓ el 28/7 en vez de confiar en la lectura de anteayer. doc-arquitecto pasa a 🟢. CLOSED_COUNT sin cambios (11): el #41 era encargo de S08, no un pendiente de DATA."},
 {f:"2026-07-28", t:"Bookkeeping del PR #51 (mergeado por Fede = firma): los ADR 010 y 011 quedan asentados en docs/decisiones/, que es LA fuente. 010 — el post-mortem destila lecciones y la AUSENCIA de lección se declara: «una referencia que acumula relleno entrena a saltearla, y una referencia que nadie lee es peor que no tenerla porque simula que el conocimiento está cubierto»; riesgo declarado: la regla puede degenerar en ritual, y la defensa no es otro gate sino que la declaración exija su porqué. 011 — un cambio de comportamiento del producto exige MINOR aunque el CI no lo obligue: se descubrió que check-consistency solo verifica que la VERSIÓN DECLARADA tenga entrada en CHANGELOG, o sea que se podía cambiar la conducta de dos comandos, pasar los 5 gates y dejar el producto distinto bajo el mismo número; se descartó automatizarlo por honestidad («¿cómo detecta un gate que un prompt cambió de comportamiento y no solo de redacción?») y queda como criterio humano declarado. HALLAZGO SOBRE S07: al ir a ejecutarla se detectó que su criterio 1 pide «autoría de la máquina» y su valor real es el cruce de reclamos con el orquestador — ambos exigen una SEGUNDA IDENTIDAD que decisiones/027 revirtió y 028 declaró ausente. La sesión quedó pedida sobre un supuesto que el taller ya no cumple. CLOSED_COUNT sin cambios (11): el #51 es asiento de decisiones ya aplicadas, no cierra ningún pendiente de DATA."},
 {f:"2026-07-27 (3)", t:"S06 CERRADA (PR #49 mergeado por Fede = firma; v1.13.0 verificada en main). p-learn → VERDE (CLOSED_COUNT 10→11). La sesión estuvo **en pausa desde el 2026-07-13** esperando un EVENTO —el primer veto real— que en 6 ciclos del loop no ocurrió; la destrabó S08 provocándolo a propósito (PR #44). Qué cambia en el producto: (1) /orquestar gana la obligación de DESTILAR la lección tras un veto o una escalada resuelta — a la referencia del tema en docs/references/ o al 🛠️ método de la ficha, con FECHA y LINK al PR de origen: «sin link no es lección, es una opinión fechada»; si el tema no tiene referencia se crea con sus triggers, porque sin ellos el conocimiento no encuentra al encargo siguiente (decisiones/009). (2) /audit-tracker lo VERIFICA POR EVIDENCIA: episodio cerrado sin lección destilada = PENDIENTE NUEVO. (3) La regla que más importa: si el episodio NO dejó conocimiento, se declara que no lo dejó — inventarle una lección llena la referencia de ruido y entrena a saltearla, que es el modo exacto en que muere un sistema de conocimiento; registrar «este veto no destiló lección, y por qué» CUMPLE la regla. Se aplicó contra el caso propio: el veto del #44 fue un EJERCICIO, no un rechazo por defecto, y no se le fabricó lección. Primera lección destilada (docs/references/verificacion-de-criterios.md, 5ª referencia): las CUATRO formas verificadas en que un chequeo mecánico sobre prosa da falso —la línea de firma escrita como ejemplo, un regex greedy, una afirmación citada dentro de su propia corrección, y una declaración partida por un salto de línea—; los cuatro eran defectos del VERIFICADOR, no del archivo. Con su lección de segundo orden: una lección aprendida NO se transfiere sola al caso siguiente (el mismo defecto de duplicación que un criterio atrapó en el PR #45 se repitió dos PRs después en el #46, y lo encontró el validador). Corrección de dato: los informes previos decían «5 chequeos falsos»; son CUATRO — se contó como falso una detección que fue correcta."},

 {f:"2026-07-18 (2)", t:"Re-auditoría tras v1.11.1 (PR #27 firmado por el validador «dale» = firma). Encargo #7 (S04): la PRIMERA instalación end-to-end verificada (config aislada CLAUDE_CONFIG_DIR) encontró un BUG que rompía la carga — el manifiesto declaraba «hooks: ./hooks/hooks.json», que Claude Code YA auto-carga → «Duplicate hooks file detected» → Status: failed to load. Regresión de v1.11.0 que nadie había visto porque nadie hizo un install real (era exactamente p-hooks-real). Fix: removida la referencia del manifiesto (los hooks se auto-cargan igual) → Status: ✔ enabled. p-install → verde (CLOSED_COUNT 9→10): install verificado + Troubleshooting en README con 5 fricciones reales. p-hooks-real SIGUE ABIERTO: el plugin carga, pero SessionStart/statusline/nudge no se ejercitaron en sesión real del CLI. Lección: el check-consistency del CI no atrapa un manifiesto que declara el hooks.json estándar — candidato a gate nuevo."},

  for(const dp of DECISION_PENDS){
    const p = allPends().find(x=>x.id===dp.pendId);
    if(!p) continue;
    h += `<div class="card curso"><div class="bh"><h3>${esc(p.txt)}</h3><span class="pill p-curso">PENDIENTE</span><span class="dchip">${esc(p.ses)}</span></div>
    <p class="kv">${esc(dp.note)}</p></div>`;
  }
  $("#tab-dec").innerHTML = h;
}
function renderTests(){
  let h = `<h2>Gates reales</h2><div class="tblwrap"><table><tr><th>GATE</th><th>CÓMO CORRE</th><th>ESTADO</th><th>FECHA</th></tr>`;
  h += TESTS.gates.map(g=>`<tr><td><b>${esc(g.n)}</b></td><td class="mono">${esc(g.cmd)}</td><td><span class="pill p-${g.st}">${g.st==="grn"?"VERDE":g.st==="amb"?"ÁMBAR":"ROJO"}</span></td><td>${esc(g.f)}</td></tr>`).join("");
  h += `</table></div><h2>Cobertura a altitud de flujo</h2>`;
  h += TESTS.flujos.map(f=>`<div class="card ${f.st==="grn"?"hecho":f.st==="amb"?"curso":"maqueta"}"><div class="bh"><h3>${esc(f.n)}</h3><span class="pill p-${f.st}">${f.st==="grn"?"🟢 CLAVADO":f.st==="amb"?"🟠 PARCIAL":"🔴 SIN EJERCITAR"}</span></div><p class="kv">${esc(f.note)}</p></div>`).join("");
  h += `<h2>Deuda de verificación</h2><div class="card pend"><p class="kv">${esc(TESTS.deuda)}</p></div>`;
  $("#tab-tests").innerHTML = h;
}
function renderRefs(){
  let h = `<p class="note">${esc(REFS.nota)}</p><h2>Catálogo</h2>`;
  if(!REFS.items.length) h += `<div class="card pend"><p class="kv"><b>docs/references/ está vacío.</b> Para una herramienta que exige referencias destiladas a los demás, esto es la deuda más irónica del repo.</p></div>`;
  h += REFS.items.map(r=>`<div class="card hecho"><div class="bh"><h3>docs/references/${esc(r.tema)}.md</h3><span class="pill p-grn">🟢 FRESCA</span><span class="rchip">${esc(r.f)}</span></div>
    <p class="kv"><b>Triggers:</b> ${r.trg.map(t=>`<span class="rchip">${esc(t)}</span>`).join(" ")}</p>
    <p class="kv"><b>Quién la usa:</b> ${esc(r.usa)}</p></div>`).join("");
  if(REFS.faltantes.length){
    h += `<h2>🔴 Faltantes (generar ANTES del encargo que las necesita)</h2>`;
    h += REFS.faltantes.map(r=>`<div class="card maqueta"><div class="bh"><h3>docs/references/${esc(r.tema)}.md</h3><span class="pill p-red">FALTANTE</span><span class="rchip">${esc(r.ses)}</span></div>
    <p class="kv"><b>Triggers:</b> ${r.trg.map(t=>`<span class="rchip">${esc(t)}</span>`).join(" ")}</p>
    <p class="kv"><b>Quién la necesita:</b> ${esc(r.para)}</p></div>`).join("");
  }
  $("#tab-refs").innerHTML = h;
}

document.addEventListener("change",(e)=>{
  const id = e.target && e.target.getAttribute && e.target.getAttribute("data-id");
  if(!id) return;
  if(e.target.checked) ticks.add(id); else ticks.delete(id);
  saveTicks(); renderMeta(); renderBoard(); renderPlan(); show(location.hash.slice(1)||"board");
});
document.addEventListener("click",(e)=>{
  const t = e.target;
  const go = t.getAttribute && t.getAttribute("data-go");
  if(go){ location.hash="board"; const el=$("#card-"+go); if(el) el.scrollIntoView({behavior:"smooth"}); return; }
  const bid = t.getAttribute && t.getAttribute("data-b");
  const sid = t.getAttribute && t.getAttribute("data-s");
  if(!bid && !sid) return;
  const txt = bid ? encargoText(DATA.flatMap(z=>z.blocks).find(b=>b.id===bid))
                  : sesText(PLAN.find(s=>s.s===sid));
  const done = ()=>{ t.textContent="Copiado ✓"; setTimeout(()=>{t.textContent = bid?"Copiar encargo":"Copiar encargo de sesión";},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }
  else fallback(txt,done);
});
function fallback(txt,done){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy");}catch(_){/*noop*/} document.body.removeChild(ta); done();
}

renderMeta(); renderTabs(); renderBoard(); renderPlan(); renderMapa(); renderStack(); renderDec(); renderTests(); renderRefs();
show(location.hash.slice(1)||"board");
</script>
